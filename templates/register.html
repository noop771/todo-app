<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Регистрация</title>
    <link rel="stylesheet" href="/static/css/style.css">
    <style>
        .auth-form { max-width: 400px; margin: 50px auto; }
        .auth-form input { width: 100%; padding: 10px; margin: 8px 0; border-radius: 8px; border: 1px solid #ddd; }
        .auth-form button { width: 100%; padding: 12px; background: #667eea; color: white; border: none; border-radius: 8px; cursor: pointer; }
        .auth-form a { display: block; text-align: center; margin-top: 10px; color: #667eea; }
    </style>
</head>
<body>
    <div class="container auth-form">
        <h1>📝 Регистрация</h1>
        <form method="POST">
            <input type="text" name="username" placeholder="Придумайте логин" required>
            <input type="password" name="password" placeholder="Придумайте пароль" required>
            <button type="submit">Зарегистрироваться</button>
        </form>
        <a href="/login">Уже есть аккаунт? Войти</a>
        {% if error %}
            <p style="color: red; text-align: center;">{{ error }}</p>
        {% endif %}
    </div>
</body>
</html>
